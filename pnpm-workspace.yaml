packages:
  - apps/*
  - libs/*
  - qa/*
  - tooling/*
  # Opt in to additional .patricktree-stack projects only when the consuming repo uses them.
  - .patricktree-stack/tooling/config-oxfmt
  - .patricktree-stack/tooling/config-oxlint
  - .patricktree-stack/tooling/config-stylelint
  - .patricktree-stack/tooling/config-playwright
  - .patricktree-stack/tooling/config-turbo-typescript
  - .patricktree-stack/tooling/config-typescript
  - .patricktree-stack/tooling/config-vitest
  - .patricktree-stack/tooling/config-wyw-in-js
  - .patricktree-stack/libs/utils-ecma

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  node-llama-cpp: true
  msw: false
  protobufjs: true
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true
  workerd: true

catalog:
  "@cloudflare/playwright": ^1.3.6
  "@playwright/test": 1.63.0
  "@typescript/native": "npm:typescript@^7.0.2"
  "@types/node": ^26.6.3
  # vitest-evals requires Vitest 4; keep the runner and coverage provider aligned.
  "@vitest/coverage-v8": 4.1.11
  oxfmt: ^0.71.0
  oxlint: ^1.86.0
  oxlint-tsgolint: ^7.0.2003
  postcss: ^8.5.28
  postcss-styled-syntax: ^0.7.3
  stylelint: ^17.15.0
  stylelint-config-recess-order: ^7.8.0
  stylelint-config-standard: ^40.0.0
  typescript: "npm:@typescript/typescript6@^6.0.2"
  vitest: ^4.1.11
  wrangler: ^4.144.0

catalogs:
  hono:
    "@hono/zod-openapi": ^1.6.3
    hono: ^4.13.11
  web-app:
    "@cloudflare/vite-plugin": ^1.62.2
    "@tanstack/router-plugin": ^1.168.41
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.1
    "@wyw-in-js/vite": ^2.5.1
    react: ^19.3.0
    react-dom: ^19.3.0
    vite: ^8.3.1

packageExtensions:
  stylelint-config-recess-order@7.8.0:
    dependencies:
      stylelint-order: ^8.1.1
  eslint-plugin-react-you-might-not-need-an-effect@1.0.2:
    # "eslint-plugin-react-you-might-not-need-an-effect" defines eslint as peer dependency, but that is not required when used by oxlint --> make it optional
    peerDependenciesMeta:
      eslint:
        optional: true

# handle peer dependencies in a strict way
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
strictPeerDependencies: true
dedupePeerDependents: false

# enforce specific Node.js and pnpm version (https://pnpm.io/npmrc#engine-strict)
engineStrict: true

# disable update notifier (https://pnpm.io/npmrc#update-notifier)
updateNotifier: false

# workspace-concurrency=0 will use amount of cores of the host to run tasks concurrently (https://pnpm.io/cli/recursive#--workspace-concurrency)
workspaceConcurrency: 0

minimumReleaseAgeExclude:
  - miniflare@5.20260815.0-alpha || 5.20260921.0-alpha
  - wrangler@4.124.0 || 4.136.1
  - openai@7.7.0
  - '@cloudflare/unenv-preset@2.16.2'
