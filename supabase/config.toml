project_id = "cup-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

# `pnpm dev:services` sets the CUP_LOCAL_* variables: localhost URLs by default, or this
# machine's tailnet URLs with `--tailnet` (see docs/local-development.md).
[auth]
enabled = true
site_url = "env(CUP_LOCAL_SITE_URL)"
additional_redirect_urls = [
  "http://localhost:5173/app/**",
  "http://127.0.0.1:5173/app/**",
  "env(CUP_LOCAL_REDIRECT_URL)",
]
jwt_issuer = "env(CUP_LOCAL_JWT_ISSUER)"
jwt_expiry = 300
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# The local test account signs in with a password (ADR 0012). The CLI turns the whole email
# provider on or off with this setting, so `false` would also refuse password sign-ins.
[auth.email]
enable_signup = true

[auth.external.google]
enabled = "env(CUP_LOCAL_GOOGLE_ENABLED)"
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "env(CUP_LOCAL_GOOGLE_REDIRECT_URI)"
skip_nonce_check = false

[storage]
enabled = false

[analytics]
enabled = false
